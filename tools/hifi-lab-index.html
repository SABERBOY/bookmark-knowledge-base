<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmark Knowledge Base — Hi-Fi HTML</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2332; --panel2: #243044; --text: #e7ecf3;
    --muted: #9aa8bc; --accent: #5b9fd4; --ok: #3dba7a; --err: #e35d6a;
    --skip: #7a8494; --border: #2c3a4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.45;
  }
  header {
    padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #152033, var(--bg));
    position: sticky; top: 0; z-index: 10;
  }
  h1 { margin: 0 0 .35rem; font-size: 1.25rem; font-weight: 650; }
  .sub { color: var(--muted); font-size: .9rem; }
  .controls { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .85rem; align-items: center; }
  input, select, button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: .5rem .7rem; font-size: .92rem;
  }
  button { cursor: pointer; }
  button.active { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
  input[type=search] { min-width: 220px; flex: 1; }
  .stats { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.7rem; }
  .chip {
    font-size: .78rem; padding: .2rem .55rem; border-radius: 999px;
    background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
  }
  .chip b { color: var(--text); font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; min-height: calc(100vh - 130px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } .viewer { min-height: 50vh; } }
  .list { border-right: 1px solid var(--border); overflow: auto; max-height: calc(100vh - 130px); }
  .item { padding: .75rem 1rem; border-bottom: 1px solid var(--border); cursor: pointer; }
  .item:hover, .item.active { background: var(--panel); }
  .item .t { font-weight: 600; font-size: .95rem; margin-bottom: .2rem; }
  .item .m { color: var(--muted); font-size: .78rem; display:flex; flex-wrap:wrap; gap:.4rem; }
  .badge { display:inline-block; padding: .05rem .4rem; border-radius: 6px; font-size: .72rem; font-weight: 600; }
  .ok { background: rgba(61,186,122,.15); color: var(--ok); }
  .fail, .error { background: rgba(227,93,106,.15); color: var(--err); }
  .skip { background: rgba(122,132,148,.15); color: var(--skip); }
  .viewer { padding: 0; overflow: hidden; max-height: calc(100vh - 130px); background: #121a24; display:flex; flex-direction:column; }
  .viewer .meta { color: var(--muted); font-size: .85rem; padding: .85rem 1.25rem; border-bottom: 1px solid var(--border); flex-shrink:0; }
  .viewer a { color: var(--accent); }
  .view-toggle { display:inline-flex; gap:.4rem; margin-top:.4rem; }
  #frameWrap { flex:1; min-height:0; }
  #frameWrap iframe { width:100%; height:100%; border:0; background:#fff; }
  #md { max-width: 52rem; padding: 1rem 1.25rem; overflow:auto; }
  #md pre { background: var(--panel); padding: .8rem; overflow:auto; border-radius: 8px; }
  #md code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; }
  .empty { color: var(--muted); padding: 2rem; }
</style>
</head>
<body>
<header>
  <h1>Bookmark Knowledge Base · Hi-Fi</h1>
  <div class="sub">SingleFile HTML 原页浏览 · MD 纯文本检索 · 全书签</div>
  <div class="controls">
    <input id="q" type="search" placeholder="搜索标题 / 域名 / URL…" />
    <select id="cat1"><option value="">全部一级分类</option></select>
    <select id="cat2"><option value="">全部二级分类</option></select>
    <select id="status">
      <option value="">全部状态</option>
      <option value="ok">ok</option>
      <option value="fail">fail</option>
      <option value="skip">skip</option>
    </select>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <section class="list" id="list"></section>
  <section class="viewer" id="viewer">
    <div class="empty">选择左侧条目。默认打开 HTML 原页；可切换「纯文本 MD」。</div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
let pages = [];
let activeId = null;
let viewMode = 'html'; // html | md

async function load() {
  let res = await fetch('data/pages.json');
  if (!res.ok) res = await fetch('pages.json');
  pages = await res.json();
  const cat1s = [...new Set(pages.map(p => p.cat1).filter(Boolean))].sort();
  const cat2s = [...new Set(pages.map(p => p.cat2).filter(Boolean))].sort();
  const s1 = document.getElementById('cat1');
  const s2 = document.getElementById('cat2');
  cat1s.forEach(c => { const o=document.createElement('option'); o.value=c; o.textContent=c; s1.appendChild(o); });
  cat2s.forEach(c => { const o=document.createElement('option'); o.value=c; o.textContent=c; s2.appendChild(o); });
  ['q','cat1','cat2','status'].forEach(id => document.getElementById(id).addEventListener('input', render));
  render();
}

function filtered() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const c1 = document.getElementById('cat1').value;
  const c2 = document.getElementById('cat2').value;
  const st = document.getElementById('status').value;
  return pages.filter(p => {
    const fs = p.fetch_status || p.status;
    if (c1 && p.cat1 !== c1) return false;
    if (c2 && p.cat2 !== c2) return false;
    if (st && fs !== st) return false;
    if (!q) return true;
    const hay = [p.title, p.domain, p.url, String(p.id)].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function render() {
  const rows = filtered();
  const counts = {};
  pages.forEach(p => { const s = p.fetch_status || p.status; counts[s]=(counts[s]||0)+1; });
  document.getElementById('stats').innerHTML = [
    chip('显示', rows.length + ' / ' + pages.length),
    chip('ok', counts.ok||0),
    chip('fail', counts.fail||0),
    chip('skip', counts.skip||0),
  ].join('');
  const list = document.getElementById('list');
  list.innerHTML = rows.map(p => {
    const fs = p.fetch_status || p.status;
    const sz = p.html_bytes ? (p.html_bytes/1024/1024).toFixed(2)+' MB' : (p.md_bytes||0)+' md';
    return `<div class="item ${p.id===activeId?'active':''}" data-id="${p.id}">
      <div class="t">${esc(p.title || p.url)}</div>
      <div class="m">
        <span class="badge ${esc(fs)}">${esc(fs)}</span>
        <span>#${p.id}</span>
        <span>${esc(p.domain||'')}</span>
        <span>${sz}</span>
      </div>
    </div>`;
  }).join('') || '<div class="empty">无匹配结果</div>';
  list.querySelectorAll('.item').forEach(el => {
    el.addEventListener('click', () => openPage(+el.dataset.id));
  });
}

function chip(k,v){ return `<span class="chip">${k}: <b>${v}</b></span>`; }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function openPage(id, mode) {
  activeId = id;
  if (mode) viewMode = mode;
  render();
  const p = pages.find(x => x.id === id);
  const viewer = document.getElementById('viewer');
  if (!p) return;
  const htmlPath = p.html_path || (`content_html/${id}.html`);
  const mdPath = p.md_path || (`content_md/${id}.md`);
  const hasHtml = (p.status==='ok' || p.fetch_status==='ok') && (p.html_bytes||0) > 0;
  const prefer = viewMode === 'md' ? 'md' : (hasHtml ? 'html' : 'md');

  viewer.innerHTML = `
    <div class="meta">
      <div><b>${esc(p.title||'')}</b></div>
      <div><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a></div>
      <div>${esc(p.cat1)} / ${esc(p.cat2)} · ${esc(p.fetch_status||p.status)} · ${esc(p.method||'')}
        · <a href="${esc(htmlPath)}" target="_blank">HTML</a>
        · <a href="${esc(mdPath)}" target="_blank">MD</a></div>
      <div class="view-toggle">
        <button id="btnHtml" class="${prefer==='html'?'active':''}">HTML原页</button>
        <button id="btnMd" class="${prefer==='md'?'active':''}">纯文本MD</button>
      </div>
    </div>
    <div id="frameWrap"><div class="empty">加载中…</div></div>`;
  document.getElementById('btnHtml').onclick = () => openPage(id, 'html');
  document.getElementById('btnMd').onclick = () => openPage(id, 'md');

  const wrap = document.getElementById('frameWrap');
  if (prefer === 'html' && hasHtml) {
    wrap.innerHTML = `<iframe sandbox="allow-same-origin allow-scripts allow-popups allow-forms" src="${esc(htmlPath)}"></iframe>`;
  } else {
    try {
      const res = await fetch(mdPath);
      if (!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      const html = (window.marked ? marked.parse(text) : '<pre>'+esc(text)+'</pre>');
      wrap.innerHTML = `<article id="md">${html}</article>`;
      wrap.style.overflow = 'auto';
    } catch (e) {
      wrap.innerHTML = `<div class="empty">无法加载：${esc(e.message)}</div>`;
    }
  }
}

load().catch(e => {
  document.getElementById('list').innerHTML = `<div class="empty">加载 data/pages.json 失败：${esc(e.message)}</div>`;
});
</script>
</body>
</html>
